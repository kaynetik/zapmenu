name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Bench
        run: zig build bench

      # Same script the release workflow runs, ad-hoc signed.
      - name: Package
        run: ./scripts/package-release.sh "v0.0.0-ci"

      - uses: actions/upload-artifact@v6
        with:
          name: zapmenu-dist
          path: dist/
